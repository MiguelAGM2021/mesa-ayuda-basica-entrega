<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mesa de Ayuda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">Mesa de Ayuda</a>
      {% if usuario %}
      <div class="d-flex align-items-center">
        <a class="nav-link text-white me-3" href="{{ url_for('ver_tickets') }}">Tickets</a>
        <a class="nav-link text-white me-3" href="{{ url_for('ver_usuarios') }}">Usuarios</a>
        <span class="text-white me-3">{{ usuario.nombre }} ({{ usuario.obtener_rol() }})</span>
        <form method="post" action="{{ url_for('cambiar_usuario') }}" class="m-0">
          <button class="btn btn-outline-light btn-sm" type="submit">Cambiar usuario</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% with mensajes = get_flashed_messages() %}
      {% if mensajes %}
        {% for mensaje in mensajes %}
          <div class="alert alert-danger">{{ mensaje }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
