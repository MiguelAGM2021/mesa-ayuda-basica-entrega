{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="mb-0">Usuarios</h1>
  <a class="btn btn-primary" href="{{ url_for('nuevo_usuario') }}">Registrar usuario</a>
</div>
<table class="table table-hover align-middle">
  <thead><tr><th>Nombre</th><th>Rol</th><th>Correo</th></tr></thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.nombre }}</td>
      <td>{{ u.obtener_rol() }}</td>
      <td>{{ u.correo }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
